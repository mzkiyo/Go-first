name: Build FishTracker

on:
  push:
  workflow_dispatch: # biar bisa di pencet manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary Linux
        run: |
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -o fishtracker -ldflags="-s -w" .

      - name: Buat Release biar bisa di-wget
        uses: softprops/action-gh-release@v2
        with:
          files: fishtracker
          tag_name: latest
